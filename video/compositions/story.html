    <div class="pane" data-pane="posting" data-region="posting" data-highlightable="posting"><div class="posting-text">Product Engineer
Acme · Remote, Canada · Full-time

About Acme

Acme builds tools for small grocers.

Independent grocery stores run on thin margins and long days. Most of them still order stock by phone, count shelves on paper and find out a product is losing money weeks after the fact. Acme gives them one place to order from their suppliers, see what is selling, and price it with confidence. More than 1,800 stores across Canada use Acme every morning before they open.

We are a team of 42, fully remote across Canadian time zones, and profitable since 2024. We grow from what our customers pay us, not from the next funding round.

The role

You will ship features end to end. As a Product Engineer on the Ordering team, you will talk to grocers, decide with your team what to build, write the code across our web app and API, and watch how it gets used once it is live. Nobody hands you a ticket with the answer already in it.

In your first six months you might:

- Rebuild how a grocer places a weekly order, so it takes ten minutes instead of an hour.
- Add supplier price changes to the ordering screen, so a store sees a cost increase before it buys.
- Pair with our support team for a week and fix the three problems grocers call about most.
- Visit a store with a teammate and watch an owner use Acme at 6 a.m.

What we are looking for

- Four or more years building web products that people pay for, with real ownership of what you shipped.
- Strong TypeScript, and comfort with a relational database (we use PostgreSQL).
- You talk to users, and you can tell a request from the problem behind it.
- You write clearly. Most of our work happens in written proposals and pull request descriptions.
- You care about the boring parts: migrations, error messages, tests that catch real bugs.

Nice to have: <mark class="highlight has-note" data-highlight-id="1" title="Pinecrest! I rebuilt their ordering.">experience with retail, inventory or logistics software; you have worked a till or stocked shelves</mark>.

How we work

- Small teams of four to six, each owning one part of the product, from the first conversation with a grocer to the support ticket after launch.
- Written first. We decide in short documents, and keep meetings for the hard conversations.
- Core hours of 11:00 to 15:00 Eastern; the rest of your day is yours.
- We ship to production many times a day, behind flags when it matters.
- Twice a year the whole company meets in person for a week.

Pay and benefits

- Salary: CA$230,000 to CA$260,000, depending on experience. We share the range for every role and we pay the same within a level, wherever in Canada you live.
- Stock options in a profitable company.
- Four weeks of vacation, plus the week between Christmas and New Year's.
- Health and dental from your first day, and a CA$1,500 yearly budget for your home office and learning.

Our values

- Grocers first. If it does not help a store owner, it can wait.
- Own the outcome. Shipping is the middle of the job, not the end.
- Say it plainly. Clear writing beats clever writing.
- Leave it better. Fix the small thing you walked past.

Hiring process

1. A short application with two written questions. We read every one.
2. A 30-minute call with the hiring manager.
3. A paid take-home: a small feature in a copy of our codebase, about four hours.
4. A conversation about your take-home with two engineers.
5. A chat with a grocer who uses Acme, and with our CEO.

We aim to finish within three weeks and we tell everyone where they stand. You must be able to work from Canada.</div></div>

  <script>
    (() => {
      const timing = JSON.parse(document.getElementById('st-timing').textContent);
      const E = timing.events;
      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

      // Layout of the stage, in its 1600×900 pixels.
      const layout = {
        posting: { x: 70, y: 60 },
        files: { x: 1010, y: 70 },
        form: { x: 470, y: 250 },
        oldChat: { x: 1070, y: 370, w: 450, h: 490 },
        chat: { x: 40, y: 40, w: 440, h: 820 },
        dossier: { x: 510, y: 40, w: 1050, h: 820 },
        full: { x: 40, y: 40, w: 1520, h: 820 },
      };
      const pageWidth = 1200; // Dossier's own width inside its window.
      const barHeight = 40;

      const cam = $('#st-cam');
      const cursor = $('#st-cursor');
      const chat = $('#st-chat');
      const dwin = $('#st-dwin');
      const dscale = $('#st-dscale');
      const app = $('#st-dpage-app');
      const home = $('#st-dpage-home');
      const windows = { posting: $('#st-posting'), files: $('#st-files'), form: $('#st-form') };

      function build() {
        // ---------- Measure Dossier's page once, in stage pixels for the window at its usual place ----------
        const pane = $('[data-pane="posting"]', app);
        const mark = $('mark.highlight', app);
        const answer = $('#why-acme', app);
        const field = answer.closest('.field');
        const form = $('.column.form', app);
        const button = $('.highlight-button', app);
        const popover = $('.popover', app);
        const noteBox = $('#highlight-note', app);

        // The quote's words, so the selection can grow word by word.
        const quote = mark.textContent;
        mark.textContent = '';
        const words = quote.split(/(?<= )/).map((word) => {
          const span = document.createElement('span');
          span.textContent = word;
          mark.append(span);
          return span;
        });

        const pageRect = () => dscale.getBoundingClientRect();
        // A point of an element on the stage when Dossier's window has the given layout.
        const at = (el, fx = 0.5, fy = 0.5, win = layout.dossier, r = el.getBoundingClientRect()) => {
          const page = pageRect();
          const k = page.width / pageWidth;
          const s = win.w / pageWidth;
          return { x: win.x + ((r.left - page.left + r.width * fx) / k) * s, y: win.y + barHeight + ((r.top - page.top + r.height * fy) / k) * s };
        };
        const rectIn = (el) => {
          const page = pageRect();
          const k = page.width / pageWidth;
          const r = el.getBoundingClientRect();
          return { left: (r.left - page.left) / k, top: (r.top - page.top) / k, right: (r.right - page.left) / k, bottom: (r.bottom - page.top) / k, width: r.width / k, height: r.height / k };
        };
        // A tab is clicked on its label, not the middle of its padded box.
        const tabPoint = (name) => {
          const tab = $(`[data-tab="${name}"]`, app);
          const label = document.createRange();
          label.selectNodeContents(tab.firstChild);
          return at(tab, 0.5, 0.5, layout.dossier, label.getBoundingClientRect());
        };

        const P = {};
        P.summaryTab = tabPoint('summary');
        P.notesTab = tabPoint('notes');
        P.postingTab = tabPoint('posting');
        P.column = (() => { const a = at($('.column.left', app), 0, 0); return a; })();

        // The Posting scrolled so the quote sits a third of the way down; the Highlight button and popover placed
        // the way highlights.js places them, under the selection.
        const paneTop = rectIn(pane).top;
        const scrollTo = pane.scrollTop + rectIn(mark).top - paneTop - 260;
        pane.scrollTop = scrollTo;
        const box = rectIn(mark);
        P.wordStart = at(words[0], 0, 0.5);
        P.wordEnds = words.map((w) => at(w, 1, 0.55));
        button.style.left = `${box.left}px`;
        button.style.top = `${box.bottom + 6}px`;
        button.hidden = false;
        P.button = at(button);
        button.hidden = true;
        popover.style.left = `${Math.max(8, Math.min(box.left, pageWidth - 300))}px`;
        popover.style.top = `${Math.min(box.bottom + 6, 891 - 160)}px`;
        popover.hidden = false;
        P.done = at($('[data-action="close-popover"]', popover));
        P.noteRest = at(noteBox, 0.82, 0.92);
        popover.hidden = true;
        pane.scrollTop = 0;

        answer.style.height = answer.dataset.heightDraft;
        const fieldRect = (() => { const a = at(field, 0, 0); const b = at(field, 1, 1); return { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y }; })();
        answer.style.height = answer.dataset.heightEmpty;

        // The last beat: the window fills the stage and the form scrolls to the Answer.
        const fullScale = layout.full.w / pageWidth;
        dscale.style.height = `${(layout.full.h - barHeight) / fullScale}px`;
        const formScroll = Math.max(0, form.scrollTop + rectIn(field).top - rectIn(form).top - 260);
        form.scrollTop = formScroll;
        P.resume = at($('.resume-shot', app), 0.35, 0.3, layout.full);
        form.scrollTop = 0;
        dscale.style.height = `${(layout.dossier.h - barHeight) / (layout.dossier.w / pageWidth)}px`;

        // ---------- The page's state at any moment ----------
        const typed = (event, t) => (t < event.at ? '' : event.text.slice(0, Math.min(event.text.length, Math.floor((t - event.at) * event.cps + 1e-6))));
        const fills = [
          ['Full name', 'Alex Martin'],
          ['Email', 'alex.martin@example.com'],
          ['LinkedIn or website', 'example.com/alex-martin'],
          ['Are you in Canada?', 'Yes'],
        ].map(([label, text], i) => {
          const f = $$('.field', app).find((el) => el.querySelector('label').firstChild.textContent.trim() === label);
          return { control: $('.answer', f), saved: $('.saved', f), text, at: E.fill.at + i * E.fill.gap };
        });
        const draft = answer.textContent;
        const prefix = draft.slice(0, draft.length - E.deleteWords.text.length);
        const deleteSteps = E.deleteWords.text.split(/(?<= )/);
        const tabs = $$('[data-tab]', app);
        const panes = $$('[data-pane]', app);
        const highlightCount = $('[data-region="highlight-count"]', app);
        const noteCount = $('[data-region="note-count"]', app);
        const why = field.querySelector('.saved');
        const chips = [
          ['#st-t-add', E.addApp.at], ['#st-t-answers', E.setAnswers.at + 1.0], ['#st-t-summary', E.setSummary.at],
          ['#st-t-note', E.addNote.at], ['#st-t-get', E.getApp.at], ['#st-t-set', E.setDraft.at],
        ].map(([id, done]) => ({ state: $(`${id} .st-state`), done: done + 0.4 }));
        const typedBox = $('#st-typed');
        const placeholder = $('#st-placeholder');

        // The Answer box grows with its text, as on the real page: measure each text the video shows, once.
        const heights = new Map();
        const measure = (text) => {
          if (!heights.has(text)) {
            answer.value = text;
            answer.style.height = 'auto';
            heights.set(text, text ? `${answer.scrollHeight + 2}px` : answer.dataset.heightEmpty);
          }
          return heights.get(text);
        };
        function whyText(t) {
          if (t < E.draftLands.at) return '';
          if (t < E.deleteWords.at) return draft;
          if (t < E.typeEnding.at) {
            const gone = Math.min(deleteSteps.length, Math.floor((t - E.deleteWords.at) / E.deleteWords.gap));
            return prefix + deleteSteps.slice(0, deleteSteps.length - gone).join('');
          }
          return prefix + typed(E.typeEnding, t);
        }

        function apply(t) {
          const tab = t < E.summaryClick.at + 0.05 ? 'posting' : t < E.notesClick.at + 0.05 ? 'summary' : t < E.postingClick.at + 0.05 ? 'notes' : 'posting';
          for (const b of tabs) b.setAttribute('aria-selected', String(b.dataset.tab === tab));
          for (const p of panes) p.hidden = p.dataset.pane !== tab;
          const scrolled = t < E.camPosting.at ? 0 : Math.min(1, (t - E.camPosting.at) / E.camPosting.dur);
          pane.scrollTop = scrollTo * gsap.parseEase('power2.inOut')(scrolled);

          for (const f of fills) {
            // The Agent sets each Answer whole, as the real page shows it.
            const n = t < f.at ? 0 : f.text.length;
            const value = f.text.slice(0, n);
            if (f.control.tagName === 'SELECT') f.control.value = n > 0 ? f.text : '';
            else f.control.value = value;
            f.saved.textContent = n >= f.text.length ? 'Updated' : '';
          }
          highlightCount.textContent = t >= E.highlightClick.at + 0.05 ? ' 1' : '';
          noteCount.textContent = t >= E.noteAdded.at ? ' 1' : '';

          const selecting = t >= E.select.at && t < E.highlightClick.at + 0.05;
          const chosen = !selecting ? 0 : Math.max(1, Math.min(words.length, Math.ceil(((t - E.select.at) / E.select.dur) * words.length)));
          words.forEach((w, i) => w.classList.toggle('st-selected', i < chosen));
          mark.classList.toggle('st-pending', t < E.highlightClick.at + 0.05);
          mark.classList.toggle('has-note', t >= E.doneClick.at + 0.05);
          button.hidden = !(t >= E.select.at + E.select.dur + 0.1 && t < E.highlightClick.at + 0.05);
          popover.hidden = !(t >= E.highlightClick.at + 0.05 && t < E.doneClick.at + 0.05);
          noteBox.value = typed(E.typeNote, t);
          noteBox.classList.toggle('st-focus', t >= E.highlightClick.at);

          const text = whyText(t);
          answer.value = text;
          // The box eases to its new height over 0.15 s, so the form below glides instead of jumping a line.
          let sum = 0;
          for (let k = 0; k < 8; k++) sum += parseFloat(heights.get(whyText(t - k * 0.02)) ?? measure(whyText(t - k * 0.02)));
          answer.value = text;
          answer.style.height = `${sum / 8}px`;
          answer.classList.toggle('st-focus', t >= E.fieldClick.at + 0.05 && t < E.full.at);
          why.textContent = t >= E.saved.at ? 'Saved' : t >= E.draftLands.at && t < E.fieldClick.at ? 'Updated' : '';

          const composer = composerText(t);
          typedBox.textContent = composer;
          placeholder.style.display = composer ? 'none' : '';
          for (const chip of chips) chip.state.textContent = t >= chip.done ? '✓' : '·';
          $('#st-chat-title').textContent = t >= E.onePage.at + 0.4 ? 'Agent · new chat' : 'Agent';
          $('#st-durl').textContent = t >= E.appOpen.at + 0.1 ? 'localhost:4747/applications/1' : 'localhost:4747';
          form.scrollTop = t < E.full.at ? 0 : formScroll * gsap.parseEase('power3.inOut')(Math.min(1, (t - E.full.at) / E.full.dur));
          applyCarets(t);
        }

        for (let t = 0; t <= timing.duration; t += 1 / 120) measure(whyText(t));
        measure(whyText(timing.duration));

        // The text cursor: where the end of a text box's text sits, found once per text with a hidden copy of the box.
        const mirror = document.createElement('div');
        app.append(mirror);
        const caretAfter = (box, text) => {
          const cs = getComputedStyle(box);
          const r = rectIn(box);
          Object.assign(mirror.style, {
            position: 'absolute', visibility: 'hidden', left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`,
            boxSizing: cs.boxSizing, padding: cs.padding, borderStyle: 'solid', borderWidth: cs.borderWidth, borderColor: 'transparent',
            font: cs.font, letterSpacing: cs.letterSpacing, lineHeight: cs.lineHeight, whiteSpace: 'pre-wrap', overflowWrap: 'break-word',
          });
          mirror.textContent = text;
          const end = document.createElement('span');
          end.textContent = '\u200b';
          mirror.append(end);
          const m = rectIn(end);
          return { x: m.left, y: m.top, h: m.height };
        };
        const answerCarets = new Map();
        for (const text of heights.keys()) answerCarets.set(text, caretAfter(answer, text));
        popover.hidden = false;
        const noteCarets = new Map();
        for (let n = 0; n <= E.typeNote.text.length; n++) noteCarets.set(E.typeNote.text.slice(0, n), caretAfter(noteBox, E.typeNote.text.slice(0, n)));
        popover.hidden = true;
        mirror.remove();
        // The Candidate clicks right after the last word of the draft, where they will start deleting.
        const draftEnd = answerCarets.get(draft);
        const s0 = layout.dossier.w / pageWidth;
        P.answerEnd = { x: layout.dossier.x + (draftEnd.x + 3) * s0, y: layout.dossier.y + barHeight + (draftEnd.y + draftEnd.h * 0.6) * s0 };

        const caretBoxes = ['answer', 'note'].map(() => {
          const caret = document.createElement('div');
          caret.className = 'st-caret';
          app.append(caret);
          return caret;
        });
        const composerCaret = $('#st-composer-caret');
        // A caret is solid while the text changes, then blinks every 0.5 s.
        const since = (textAt, t) => {
          const now = textAt(t);
          let s = 0;
          while (s < 1.2 && textAt(t - s - 1 / 60) === now) s += 1 / 60;
          return s;
        };
        const blinkOn = (s) => s % 1.0 < 0.55;
        const showCaret = (caret, pos, on) => {
          caret.style.opacity = on ? '1' : '0';
          if (on) Object.assign(caret.style, { left: `${pos.x}px`, top: `${pos.y}px`, height: `${pos.h}px` });
        };
        const noteText = (t) => typed(E.typeNote, t);
        const composerText = (t) => t < E.sendClick.at + 0.05 ? typed(E.typeFound, t) + (t >= E.paste.at ? 'jobs.example.com/acme/product-engineer' : '')
          : t < E.send2Click.at + 0.05 ? typed(E.typeDraft, t) : '';
        function applyCarets(t) {
          const editing = t >= E.fieldClick.at + 0.05 && t < E.full.at;
          showCaret(caretBoxes[0], answerCarets.get(whyText(t)), editing && blinkOn(since(whyText, t)));
          const noting = t >= E.highlightClick.at + 0.05 && t < E.doneClick.at + 0.05;
          showCaret(caretBoxes[1], noteCarets.get(noteText(t)), noting && blinkOn(since(noteText, t)));
          const composing = (t >= E.composerClick.at + 0.05 && t < E.sendClick.at + 0.05) || (t >= E.composer2Click.at + 0.05 && t < E.send2Click.at + 0.05);
          composerCaret.style.opacity = composing && blinkOn(since(composerText, t)) ? '1' : '0';
          // Before any text the caret sits at the start, ahead of the placeholder.
          if (composerText(t)) typedBox.after(composerCaret);
          else placeholder.before(composerCaret);
        }

        // ---------- Motion ----------
        const tl = gsap.timeline({ paused: true });
        const state = { t: 0 };
        tl.fromTo(state, { t: 0 }, { t: timing.duration, duration: timing.duration, ease: 'none', onUpdate: () => apply(state.t) }, 0);

        // The camera frames a box of the stage; the stage is 1600×900.
        const view = (x, y, w, h) => {
          const z = Math.min(1600 / w, 900 / h);
          return { x: 800 - (x + w / 2) * z, y: 450 - (y + h / 2) * z, scale: z };
        };
        const wide = { x: 0, y: 0, scale: 1 };
        let camNow = wide;
        const camera = (to, at, dur, ease = 'power2.inOut') => {
          tl.fromTo(cam, { ...camNow }, { ...to, duration: dur, ease, immediateRender: false }, at);
          camNow = to;
        };
        gsap.set(cam, { transformOrigin: '0 0', ...wide });

        // The cursor travels on a gentle curve: x and y ease differently. Points are where its tip lands.
        const tip = { x: 40 * 4 / 28, y: 40 * 2 / 28 };
        const atTip = (point) => ({ x: point.x - tip.x, y: point.y - tip.y });
        let cursorNow = { x: 1700, y: 980 };
        gsap.set(cursor, { x: cursorNow.x, y: cursorNow.y, scale: 1, transformOrigin: `${tip.x}px ${tip.y}px` });
        const move = (point, at, dur) => {
          const to = atTip(point);
          tl.fromTo(cursor, { x: cursorNow.x }, { x: to.x, duration: dur, ease: 'power2.inOut', immediateRender: false }, at);
          tl.fromTo(cursor, { y: cursorNow.y }, { y: to.y, duration: dur, ease: 'sine.inOut', immediateRender: false }, at);
          cursorNow = to;
        };
        const press = (at) => {
          tl.fromTo(cursor, { scale: 1 }, { scale: 0.84, duration: 0.07, ease: 'power2.out', immediateRender: false }, at);
          tl.fromTo(cursor, { scale: 0.84 }, { scale: 1, duration: 0.22, ease: 'back.out(3)', immediateRender: false }, at + 0.08);
        };
        // A window answers a click by springing forward.
        let front = 10;
        const raise = (el, at) => {
          tl.set(el, { zIndex: ++front }, at);
          tl.fromTo(el, { scale: 1 }, { scale: 1.025, duration: 0.1, ease: 'power2.out', immediateRender: false }, at);
          tl.fromTo(el, { scale: 1.025 }, { scale: 1, duration: 0.45, ease: 'back.out(2.5)', immediateRender: false }, at + 0.1);
        };
        // A field the Agent just filled pings once: a ring grows out of its border and fades.
        const ping = (el, when) => {
          tl.fromTo(el, { boxShadow: '0 0 0 0px rgb(10 10 10 / 0.85)' },
            { boxShadow: '0 0 0 8px rgb(10 10 10 / 0)', duration: 0.6, ease: 'power2.out', immediateRender: false }, when);
        };

        // A chat message springs up into place.
        const appear = (selector, at) => {
          tl.fromTo(selector, { opacity: 0, y: 16, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.7)' }, at);
        };
        // A caption is the Candidate thinking out loud, so it pops out of the cursor. Captions are placed after the
        // motion is built, where the cursor is on screen at that moment.
        const captions = [];
        const caption = (event) => captions.push(event);
        const stage = $('#st-stage');
        const onStage = (r) => {
          const box = stage.getBoundingClientRect();
          const k = box.width / 1600;
          return { left: (r.left - box.left) / k, top: (r.top - box.top) / k, right: (r.right - box.left) / k, bottom: (r.bottom - box.top) / k };
        };
        const placeCaptions = () => {
          for (const event of captions) {
            tl.seek(event.at);
            const c = onStage(cursor.getBoundingClientRect());
            const tip = { x: c.left + (c.right - c.left) * 4 / 28, y: c.top + (c.bottom - c.top) * 2 / 28 };
            const bubble = document.createElement('div');
            bubble.className = 'st-bubble';
            bubble.textContent = event.text;
            $('#st-captions').append(bubble);
            const w = bubble.offsetWidth;
            const h = bubble.offsetHeight;
            // Up and to the right of the cursor; to the left near the right edge; below it near the top.
            const left = tip.x + 26 + w > 1580 ? tip.x - 18 - w : tip.x + 26;
            const top = tip.y - 22 - h < 20 ? tip.y + 46 : tip.y - 22 - h;
            bubble.style.left = `${left}px`;
            bubble.style.top = `${top}px`;
            bubble.style.transformOrigin = `${left < tip.x ? '100%' : '0'} ${top > tip.y ? '0' : '100%'}`;
            tl.fromTo(bubble, { opacity: 0, y: top > tip.y ? -12 : 12, scale: 0.6, filter: 'blur(0px)' },
              { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.8)' }, event.at);
            tl.to(bubble, { opacity: 0, y: -8, filter: 'blur(4px)', duration: 0.22, ease: 'power2.in' }, event.at + event.dur - 0.22);
          }
        };
        // Where an element's centre is in the camera's world at a moment, for clicks on things that move or grow.
        const centerAt = (el, t) => {
          tl.seek(t);
          const box = cam.getBoundingClientRect();
          const k = box.width / 1600;
          const r = el.getBoundingClientRect();
          return { x: (r.left + r.width / 2 - box.left) / k, y: (r.top + r.height / 2 - box.top) / k };
        };

        // 1. The problem: one job, four windows, landing one after another.
        const order = [['posting', windows.posting], ['files', windows.files], ['oldChat', chat], ['form', windows.form]];
        gsap.set(chat, { width: layout.oldChat.w, height: layout.oldChat.h });
        order.forEach(([name, el], i) => {
          el.style.zIndex = String(++front);
          gsap.set(el, { opacity: 0 });
          const { x, y } = layout[name];
          tl.fromTo(el, { x: x + (x < 600 ? -80 : 80), y: y + 90, scale: 0.88 },
            { x, y, scale: 1, duration: 0.75, ease: 'back.out(1.4)' }, 0.05 + i * 0.1);
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power1.out', immediateRender: false }, 0.05 + i * 0.1);
        });
        gsap.set(dwin, { x: layout.dossier.x, y: layout.dossier.y, width: layout.dossier.w, height: layout.dossier.h, opacity: 0 });
        cursor.style.zIndex = '1000';
        move({ x: layout.form.x + 300, y: layout.form.y + 300 }, E.cursorIn.at, E.cursorIn.dur);
        caption(E.capWhy);
        move({ x: layout.files.x + 230, y: layout.files.y + 160 }, E.filesMove.at, E.filesMove.dur);
        press(E.filesClick.at);
        raise(windows.files, E.filesClick.at + 0.05);
        caption(E.capResume);
        // The hovered file's row lights up behind its name, following the cursor down the list.
        const rowOn = $('#st-row-on');
        const list = $('.st-files', windows.files);
        const rows = $$('li', list).map((li) => ({ x: list.offsetLeft + li.offsetLeft, y: list.offsetTop + li.offsetTop, w: li.offsetWidth, h: li.offsetHeight }));
        gsap.set(rowOn, { left: rows[0].x, top: 0, width: rows[0].w, height: rows[0].h, opacity: 0 });
        [2, 3, 4].forEach((row, i) => {
          const when = E.rows.at + i * E.rows.gap;
          move({ x: layout.files.x + rows[row].x + 190, y: layout.files.y + rows[row].y + rows[row].h / 2 }, when, 0.25);
          if (i === 0) tl.fromTo(rowOn, { opacity: 0, y: rows[row].y }, { opacity: 1, y: rows[row].y, duration: 0.12, immediateRender: false }, when + 0.15);
          else tl.fromTo(rowOn, { y: rows[row - 1].y }, { y: rows[row].y, duration: 0.14, ease: 'power2.out', immediateRender: false }, when + 0.15);
        });
        tl.to(rowOn, { opacity: 0, duration: 0.15 }, E.rows.at + 3 * E.rows.gap + 0.2);
        move({ x: layout.oldChat.x + 220, y: layout.oldChat.y + 250 }, E.chatMove.at, E.chatMove.dur);
        press(E.chatClick.at);
        raise(chat, E.chatClick.at + 0.05);
        tl.fromTo('#st-old-list', { y: 0 }, { y: 120, duration: 2.2, ease: 'power2.inOut' }, E.chatClick.at + 0.1);
        caption(E.capChat);

        // 2. One page instead: the old windows fly off, the chat moves left, Dossier lands beside it.
        const out = E.onePage.at;
        Object.values(windows).forEach((el, i) => {
          tl.to(el, { x: '+=340', y: '+=140', scale: 0.6, opacity: 0, filter: 'blur(10px)', duration: 0.45, ease: 'power3.in' }, out + i * 0.04);
        });
        tl.to('#st-old-msgs', { opacity: 0, duration: 0.2 }, out);
        tl.fromTo(chat, { x: layout.oldChat.x, y: layout.oldChat.y, width: layout.oldChat.w, height: layout.oldChat.h },
          { x: layout.chat.x, y: layout.chat.y, width: layout.chat.w, height: layout.chat.h, duration: 0.8, ease: 'power3.inOut', immediateRender: false }, out);
        tl.set(dwin, { zIndex: ++front }, out);
        tl.fromTo(dwin, { y: layout.dossier.y + 60, scale: 0.92, opacity: 0 },
          { y: layout.dossier.y, scale: 1, opacity: 1, duration: 0.8, ease: 'back.out(1.5)', immediateRender: false }, out + 0.3);
        gsap.set(app, { opacity: 0 });
        $$('#st-msgs > .st-msg').forEach((el) => gsap.set(el, { opacity: 0 }));
        caption(E.capOnePage);
        move({ x: 200, y: 822 }, E.composerMove.at, E.composerMove.dur);
        press(E.composerClick.at);
        move(centerAt($('.st-send'), E.sendMove.at), E.sendMove.at, E.sendMove.dur);
        press(E.sendClick.at);
        appear('#st-m-found', E.sendClick.at + 0.05);
        move({ x: 470, y: 690 }, E.sendClick.at + 0.25, 0.5);

        // 3. The Agent fills the page while it works.
        appear('#st-m-reading', E.reading.at);
        appear('#st-t-add', E.addApp.at);
        tl.to(home, { opacity: 0, filter: 'blur(8px)', duration: 0.18, ease: 'power2.in' }, E.appOpen.at);
        tl.fromTo(app, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.25, ease: 'power2.out', immediateRender: false }, E.appOpen.at + 0.12);
        appear('#st-t-answers', E.setAnswers.at);
        fills.forEach((f) => ping(f.control, f.at));
        appear('#st-t-summary', E.setSummary.at);
        move(P.summaryTab, E.summaryMove.at, E.summaryMove.dur);
        press(E.summaryClick.at);
        tl.fromTo($('[data-pane="summary"] .markdown', app), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, E.summaryClick.at + 0.05);
        appear('#st-t-note', E.addNote.at);
        move(P.notesTab, E.notesMove.at, E.notesMove.dur);
        press(E.notesClick.at);
        tl.fromTo($('.note', app), { opacity: 0, y: 18, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.6)' }, E.notesClick.at + 0.05);
        appear('#st-m-fits', E.fits.at);
        caption(E.capRead);

        // 4. The Candidate highlights what matters to them and says why.
        move(P.postingTab, E.postingMove.at, E.postingMove.dur);
        press(E.postingClick.at);
        camera(view(P.column.x - 10, P.column.y + 95, 820, 820 * 9 / 16), E.camPosting.at, E.camPosting.dur);
        move(P.wordStart, E.quoteMove.at, E.quoteMove.dur);
        caption(E.capOldJob);
        press(E.select.at - 0.05);
        P.wordEnds.forEach((point, i) => {
          const step = E.select.dur / words.length;
          const from = atTip(i === 0 ? P.wordStart : P.wordEnds[i - 1]);
          const to = atTip(point);
          tl.fromTo(cursor, { x: from.x, y: from.y }, { x: to.x, y: to.y, duration: step, ease: 'none', immediateRender: false }, E.select.at + i * step);
        });
        cursorNow = atTip(P.wordEnds[P.wordEnds.length - 1]);
        tl.fromTo(button, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2)' }, E.select.at + E.select.dur + 0.1);
        move(P.button, E.buttonMove.at, E.buttonMove.dur);
        press(E.highlightClick.at);
        move(P.noteRest, E.highlightClick.at + 0.2, 0.35);
        tl.fromTo(popover, { opacity: 0, y: -6, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: 'back.out(1.8)' }, E.highlightClick.at + 0.05);
        move(P.done, E.doneMove.at, E.doneMove.dur);
        press(E.doneClick.at);

        // 5. The Agent drafts an Answer from the Highlight; the camera moves to the chat while the Candidate types.
        camera(view(0, 360, 960, 540), E.camChat.at, E.camChat.dur);
        move({ x: 200, y: 822 }, E.composer2Move.at, E.composer2Move.dur);
        press(E.composer2Click.at);
        move(centerAt($('.st-send'), E.send2Move.at), E.send2Move.at, E.send2Move.dur);
        press(E.send2Click.at);
        appear('#st-m-draft', E.send2Click.at + 0.05);
        camera(wide, E.camWide2.at, E.camWide2.dur);
        move({ x: 470, y: 690 }, E.send2Click.at + 0.25, 0.5);
        appear('#st-t-get', E.getApp.at);
        appear('#st-t-set', E.setDraft.at);
        ping(answer, E.draftLands.at);
        appear('#st-m-drafted', E.drafted.at);
        move(at(answer, 0.62, 0.35), E.draftLands.at, 0.5);
        caption(E.capNote);

        // 6. The Candidate makes it theirs.
        camera(view(fieldRect.x + fieldRect.w / 2 - 470, fieldRect.y + fieldRect.h / 2 - 264, 940, 528), E.camField.at, E.camField.dur);
        move(P.answerEnd, E.fieldMove.at, E.fieldMove.dur);
        press(E.fieldClick.at);
        caption(E.capMyWay);

        // 7. Everything for this job on one page: the window takes the whole stage.
        camera(wide, E.full.at, E.full.dur, 'power3.inOut');
        tl.to(chat, { x: -520, opacity: 0, duration: E.full.dur * 0.9, ease: 'power3.inOut' }, E.full.at);
        const fullFrom = { x: layout.dossier.x, w: layout.dossier.w };
        const resize = { p: 0 };
        tl.fromTo(resize, { p: 0 }, {
          p: 1, duration: E.full.dur, ease: 'power3.inOut', immediateRender: false,
          onUpdate: () => {
            const w = fullFrom.w + (layout.full.w - fullFrom.w) * resize.p;
            const s = w / pageWidth;
            gsap.set(dwin, { x: fullFrom.x + (layout.full.x - fullFrom.x) * resize.p, width: w });
            gsap.set(dscale, { scale: s, height: (layout.dossier.h - barHeight) / s });
          },
        }, E.full.at);
        move(P.resume, E.full.at, E.full.dur);
        caption(E.capSamePage);

        // 8. Into the end card: the page fades to black, which the end card closes into the dot of Dossier's i.
        tl.fromTo('#st-black', { opacity: 0 }, { opacity: 1, duration: E.fadeOut.dur, ease: 'power2.in' }, E.fadeOut.at);
        tl.to({}, { duration: 0.01 }, timing.duration - 0.01);

        gsap.set(dscale, { scale: layout.dossier.w / pageWidth, height: (layout.dossier.h - barHeight) / (layout.dossier.w / pageWidth) });
        placeCaptions();
        tl.seek(0);
        apply(0);
        window.__timelines['story'] = tl;
      }

      document.fonts.ready.then(build);
    })();
  </script>
</template>
